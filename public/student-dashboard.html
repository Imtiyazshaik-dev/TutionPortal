<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - Tuition Portal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .portal-section {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .calendar-day {
      background: rgba(30, 41, 59, 0.5);
      padding: 8px;
      text-align: center;
      border-radius: 6px;
      font-size: 12px;
    }
    .day-present { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; }
    .day-absent { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; }
    .day-holiday { background: rgba(59, 130, 246, 0.2); border: 1px solid #3b82f6; color: #3b82f6; }
    .day-sunday { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 700px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div>
        <h2 id="welcomeText" style="margin: 0; color: #38bdf8;">Student Portal</h2>
        <p id="studentMeta" style="margin: 4px 0 0 0; font-size: 13px; color: #94a3b8;"></p>
      </div>
      <a href="index.html" onclick="localStorage.clear()" style="background: #ef4444; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; text-decoration: none; font-weight: bold;">Log Out</a>
    </div>

    <!-- Attendance & Stats Section -->
    <div class="portal-section">
      <h3 style="margin-top: 0; color: #fff; font-size: 16px;">📅 Attendance & Calendar</h3>
      <p id="attendanceSummaryText" style="font-size: 14px; color: #cbd5e1; margin-bottom: 10px;">Loading attendance stats...</p>
      <div id="calendarContainer" class="calendar-grid"></div>
    </div>

    <!-- Live Class Section -->
    <div id="liveClassSection" class="portal-section" style="display:none;">
      <h3 style="margin-top: 0; color: #10b981; font-size: 16px;">🔴 Live Class Active</h3>
      <p id="liveClassTitleText" style="font-size: 14px; margin-bottom: 10px;"></p>
      <a id="liveClassLinkBtn" href="#" target="_blank" onclick="joinLiveClass()" style="display:inline-block; background:#10b981; color:#fff; padding:10px 20px; border-radius:8px; font-weight:bold; text-decoration:none;">Join Google Meet & Mark Attendance</a>
    </div>

    <!-- Leaderboard & XP -->
    <div class="portal-section">
      <h3 style="margin-top: 0; color: #f59e0b; font-size: 16px;">🏆 Cohort Leaderboard & XP</h3>
      <div id="leaderboardListContainer" style="max-height: 180px; overflow-y: auto;">
        <p style="font-size: 13px; color: #94a3b8; margin: 0;">Loading leaderboard...</p>
      </div>
    </div>

    <!-- Assessment Tests -->
    <div class="portal-section">
      <h3 style="margin-top: 0; color: #38bdf8; font-size: 16px;">📝 Assessment Tests</h3>
      <div id="testsListContainer">
        <p style="font-size: 13px; color: #94a3b8; margin: 0;">Loading tests...</p>
      </div>
    </div>

    <!-- Study Notes -->
    <div class="portal-section">
      <h3 style="margin-top: 0; color: #a855f7; font-size: 16px;">📚 Study Resources & Notes</h3>
      <div id="notesListContainer">
        <p style="font-size: 13px; color: #94a3b8; margin: 0;">Loading study notes...</p>
      </div>
    </div>
  </div>

  <script>
    let activeClassIdVal = null;
    let activeClassTitleVal = '';

    async function loadStudentPortalData() {
      const studentId = localStorage.getItem('userId');
      const role = localStorage.getItem('role');

      if (!studentId || role !== 'student') {
        window.location.href = 'index.html';
        return;
      }

      try {
        const res = await fetch(`/api/student/classroom-data/${studentId}`);
        const data = await res.json();

        if (data.success && data.student) {
          document.getElementById('welcomeText').innerText = `Welcome, ${data.student.username}`;
          document.getElementById('studentMeta').innerText = `ID Tag: ${data.student.studentIdTag || 'N/A'} | XP: ${data.student.xp} XP`;

          // Render Calendar & Attendance
          if (data.attendanceStats) {
            const stats = data.attendanceStats;
            document.getElementById('attendanceSummaryText').innerHTML = `Overall Attendance: <strong style="color:#10b981;">${stats.percentage}%</strong> (${stats.totalPresent} Present / ${stats.totalWorkingDays} Working Days)`;
            
            const calContainer = document.getElementById('calendarContainer');
            calContainer.innerHTML = '';
            
            if (stats.calendarMap) {
              Object.keys(stats.calendarMap).sort().forEach(dateStr => {
                const status = stats.calendarMap[dateStr];
                let cssClass = 'calendar-day';
                let shortDate = dateStr.slice(8); // Day number e.g. "04"

                if (status === 'Present') cssClass += ' day-present';
                else if (status === 'Absent') cssClass += ' day-absent';
                else if (status === 'Holiday') cssClass += ' day-holiday';
                else if (status === 'Sunday') cssClass += ' day-sunday';

                calContainer.innerHTML += `<div class="${cssClass}" title="${dateStr}: ${status}">${shortDate}<br><span style="font-size:9px;">${status.slice(0,3)}</span></div>`;
              });
            }
          }

          // Render Live Class Box
          if (data.activeClass) {
            activeClassIdVal = data.activeClass._id;
            activeClassTitleVal = data.activeClass.title;
            document.getElementById('liveClassSection').style.display = 'block';
            document.getElementById('liveClassTitleText').innerText = data.activeClass.title;
            document.getElementById('liveClassLinkBtn').href = data.activeClass.meetLink;
          } else {
            document.getElementById('liveClassSection').style.display = 'none';
          }

          // Render Leaderboard
          if (data.leaderboard) {
            const lbContainer = document.getElementById('leaderboardListContainer');
            lbContainer.innerHTML = '';
            data.leaderboard.forEach((s, idx) => {
              lbContainer.innerHTML += `
                <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px;">
                  <span><strong>#${idx+1}</strong> ${s.username}</span>
                  <span><strong style="color:#10b981;">${s.attendancePercentage}%</strong> | <span style="color:#f59e0b;">${s.xp} XP</span></span>
                </div>`;
            });
          }

          // Render Tests
          if (data.tests) {
            const testContainer = document.getElementById('testsListContainer');
            testContainer.innerHTML = '';
            const submittedSet = new Set(data.submittedResults || []);

            if (data.tests.length === 0) {
              testContainer.innerHTML = '<p style="font-size:13px; color:#94a3b8; margin:0;">No tests available right now.</p>';
            } else {
              data.tests.forEach(test => {
                const isDone = submittedSet.has(test._id);
                let actionHtml = '';
                if (isDone) {
                  actionHtml = '<span style="color:#10b981; font-weight:bold; font-size:12px;">✅ Completed</span>';
                } else if (test.isUnlocked) {
                  actionHtml = `<a href="exam.html?id=${test._id}" style="background:#38bdf8; color:#0f172a; padding:6px 12px; border-radius:6px; font-weight:bold; text-decoration:none; font-size:12px;">Take Test</a>`;
                } else {
                  actionHtml = '<span style="color:#ef4444; font-size:12px;">🔒 Locked / Expired</span>';
                }

                testContainer.innerHTML += `
                  <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px;">
                    <div><strong>${test.title}</strong><br><span style="font-size:11px; color:#94a3b8;">${test.statusMessage}</span></div>
                    <div>${actionHtml}</div>
                  </div>`;
              });
            }
          }

          // Render Notes
          if (data.notes) {
            const notesContainer = document.getElementById('notesListContainer');
            notesContainer.innerHTML = '';
            if (data.notes.length === 0) {
              notesContainer.innerHTML = '<p style="font-size:13px; color:#94a3b8; margin:0;">No study resources published yet.</p>';
            } else {
              data.notes.forEach(note => {
                notesContainer.innerHTML += `
                  <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px;">
                    <span>📄 ${note.title}</span>
                    <a href="${note.contentOrLink}" target="_blank" style="color:#38bdf8; text-decoration:none; font-weight:bold;">View Resource</a>
                  </div>`;
              });
            }
          }
        }
      } catch (err) {
        console.error("Student portal sync error:", err);
      }
    }

    async function joinLiveClass() {
      const userId = localStorage.getItem('userId');
      if (activeClassIdVal && userId) {
        await fetch('/api/student/join-class', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, classId: activeClassIdVal, classTitle: activeClassTitleVal })
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStudentPortalData();
      // Auto-refresh polling every 15 seconds for real-time calendar and XP updates
      setInterval(loadStudentPortalData, 15000);
    });
  </script>
</body>
</html>
