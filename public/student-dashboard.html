<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 600px;">
    <h2>Student Portal</h2>
    <p id="studentWelcome">Welcome, Student</p>

    <div style="background: rgba(30,41,59,0.5); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
      <h3>📅 Attendance Calendar</h3>
      <div id="attendanceText" style="margin-bottom: 10px; font-size: 14px; color: #10b981;">Loading attendance...</div>
      <div id="calendarGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px;"></div>
    </div>

    <div id="liveClassBox" style="display:none; background: rgba(16,185,129,0.1); border: 1px solid #10b981; padding: 15px; border-radius: 12px; margin-bottom: 20px;">
      <h3 style="color:#10b981; margin-top:0;">🔴 Active Live Class</h3>
      <p id="liveClassTitle" style="font-size:14px;"></p>
      <a id="liveClassBtn" href="#" target="_blank" onclick="markAttendance()" style="display:inline-block; background:#10b981; color:#fff; padding:8px 16px; border-radius:6px; text-decoration:none; font-weight:bold; font-size:13px;">Join Class & Mark Attendance</a>
    </div>

    <div style="background: rgba(30,41,59,0.5); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
      <h3>🏆 Cohort Leaderboard</h3>
      <div id="leaderboardList" style="max-height: 150px; overflow-y: auto;"></div>
    </div>

    <div style="background: rgba(30,41,59,0.5); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
      <h3>📝 Tests</h3>
      <div id="testsList"></div>
    </div>

    <div style="background: rgba(30,41,59,0.5); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
      <h3>📚 Study Notes</h3>
      <div id="notesList"></div>
    </div>

    <div style="text-align:center;">
      <a href="index.html" onclick="localStorage.clear()" style="color:#ef4444; text-decoration:none; font-weight:bold;">Log Out</a>
    </div>
  </div>

  <script>
    let currentLiveClassId = null;
    let currentLiveClassTitle = '';

    async function loadStudentData() {
      const studentId = localStorage.getItem('userId');
      if (!studentId) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const res = await fetch(`/api/student/classroom-data/${studentId}`);
        const data = await res.json();

        if (data.success && data.student) {
          document.getElementById('studentWelcome').innerText = `Welcome, ${data.student.username} (${data.student.studentIdTag || ''}) - XP: ${data.student.xp}`;

          if (data.attendanceStats) {
            const stats = data.attendanceStats;
            document.getElementById('attendanceText').innerHTML = `Attendance: <strong>${stats.percentage}%</strong> (${stats.totalPresent}/${stats.totalWorkingDays})`;
            
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            if (stats.calendarMap) {
              Object.keys(stats.calendarMap).sort().forEach(date => {
                const status = stats.calendarMap[date];
                let bg = 'rgba(255,255,255,0.05)';
                let color = '#fff';
                if (status === 'Present') { bg = 'rgba(16,185,129,0.2)'; color = '#10b981'; }
                else if (status === 'Absent') { bg = 'rgba(239,68,68,0.2)'; color = '#ef4444'; }
                else if (status === 'Holiday') { bg = 'rgba(59,130,246,0.2)'; color = '#3b82f6'; }
                else if (status === 'Sunday') { bg = 'transparent'; color = '#64748b'; }

                grid.innerHTML += `<div style="background:${bg}; color:${color}; padding:6px; text-align:center; border-radius:4px; font-size:11px;" title="${date}: ${status}">${date.slice(8)}<br><span style="font-size:8px;">${status.slice(0,3)}</span></div>`;
              });
            }
          }

          if (data.activeClass) {
            currentLiveClassId = data.activeClass._id;
            currentLiveClassTitle = data.activeClass.title;
            document.getElementById('liveClassBox').style.display = 'block';
            document.getElementById('liveClassTitle').innerText = data.activeClass.title;
            document.getElementById('liveClassBtn').href = data.activeClass.meetLink;
          } else {
            document.getElementById('liveClassBox').style.display = 'none';
          }

          const lb = document.getElementById('leaderboardList');
          lb.innerHTML = '';
          if (data.leaderboard) {
            data.leaderboard.forEach((s, i) => {
              lb.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.05);"><span>#${i+1} ${s.username}</span><span>${s.xp} XP | ${s.attendancePercentage}%</span></div>`;
            });
          }

          const tests = document.getElementById('testsList');
          tests.innerHTML = '';
          const submitted = new Set(data.submittedResults || []);
          if (data.tests) {
            data.tests.forEach(t => {
              let action = submitted.has(t._id) ? '<span style="color:#10b981;">Completed</span>' : (t.isUnlocked ? `<a href="exam.html?id=${t._id}" style="color:#38bdf8;">Take Test</a>` : '<span style="color:#ef4444;">Locked</span>');
              tests.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);"><span>${t.title}</span><span>${action}</span></div>`;
            });
          }

          const notes = document.getElementById('notesList');
          notes.innerHTML = '';
          if (data.notes) {
            data.notes.forEach(n => {
              notes.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);"><span>${n.title}</span><a href="${n.contentOrLink}" target="_blank" style="color:#38bdf8;">View</a></div>`;
            });
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    async function markAttendance() {
      const studentId = localStorage.getItem('userId');
      if (currentLiveClassId && studentId) {
        await fetch('/api/student/join-class', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: studentId, classId: currentLiveClassId, classTitle: currentLiveClassTitle })
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStudentData();
      setInterval(loadStudentData, 15000);
    });
  </script>
</body>
</html>
