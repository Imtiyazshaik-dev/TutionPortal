<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tuition Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F1EEE3;
      --surface: #FFFFFF;
      --ink: #1E2A1A;
      --ink-soft: #5C6555;
      --accent: #23361C;
      --accent-soft: #DCE6D0;
      --accent-strong: #152613;
      --danger: #8B3A2B;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Work Sans', sans-serif !important;
      background: var(--bg) !important;
      background-image: none !important;
      color: var(--ink) !important;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    body::before { display: none !important; }

    .login-card {
      background: var(--surface);
      border: 3px solid var(--ink);
      border-radius: 28px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      box-sizing: border-box;
      opacity: 0;
      animation: settle 0.5s ease-out forwards;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .login-card { animation: none; opacity: 1; }
    }

    .login-mark { width: 52px; height: 52px; border-radius: 16px; border: 2px solid var(--ink); background: var(--accent-soft); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 26px; }

    .login-card h2 {
      font-family: 'Baloo 2', sans-serif !important;
      color: var(--ink) !important;
      font-weight: 700 !important;
      font-size: 26px !important;
      letter-spacing: 0 !important;
      margin: 0 0 6px 0 !important;
    }

    .login-card p {
      color: var(--ink-soft) !important;
      font-size: 14px !important;
      margin: 0 0 24px 0 !important;
      text-align: left !important;
    }

    .login-card .input-group { margin-bottom: 16px; }

    .login-card .input-group label {
      color: var(--ink) !important;
      font-weight: 600 !important;
      font-size: 12px !important;
      text-transform: uppercase !important;
      letter-spacing: 0.4px !important;
    }

    .login-card .input-group input {
      background: var(--surface) !important;
      border: 2px solid var(--ink) !important;
      border-radius: 12px !important;
      color: var(--ink) !important;
      font-family: 'Work Sans', sans-serif !important;
      padding: 12px 14px !important;
    }

    .login-card .input-group input:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px var(--accent-soft) !important;
    }

    .login-card .input-group input::placeholder { color: #A6A190; }

    .login-card button {
      background: var(--accent) !important;
      border: 2px solid var(--ink) !important;
      border-radius: 999px !important;
      box-shadow: none !important;
      font-family: 'Work Sans', sans-serif !important;
      font-weight: 700 !important;
      font-size: 15px !important;
      padding: 13px !important;
    }

    .login-card button:hover {
      background: var(--accent-strong) !important;
      transform: none !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-mark">🎓</div>
    <h2>Tuition Portal</h2>
    <p>Enter your credentials to access your portal</p>

    <div class="input-group">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="Enter username" />
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter password" />
    </div>

    <button onclick="handleLogin()" style="width: 100%; margin-top: 6px;">Log In</button>

    <div id="loginErrorMsg" style="color: var(--danger); font-size: 13px; text-align: center; margin-top: 15px;"></div>
  </div>

  <script>
    async function handleLogin() {
      const usernameField = document.getElementById('loginUser');
      const passwordField = document.getElementById('loginPass');
      const errorDiv = document.getElementById('loginErrorMsg');

      const username = usernameField ? usernameField.value.trim() : '';
      const password = passwordField ? passwordField.value.trim() : '';

      if (errorDiv) errorDiv.innerText = '';

      if (!username || !password) {
        if (errorDiv) errorDiv.innerText = 'Please enter both username and password.';
        return;
      }

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('userId', data.userId);
          localStorage.setItem('role', data.role);
          localStorage.setItem('username', data.username);

          if (data.role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'student-dashboard.html';
          }
        } else {
          if (errorDiv) errorDiv.innerText = data.message || 'Invalid credentials.';
          console.warn("Login failed:", data.message);
        }
      } catch (err) {
        console.error("Login network/server error:", err);
        if (errorDiv) errorDiv.innerText = 'Server connection error. Please try again.';
      }
    }
  </script>
</body>
</html>
