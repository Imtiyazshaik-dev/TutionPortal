<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tuition Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 80px;">
    <h2>Tuition Portal Login</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px;">Enter your credentials to access your portal</p>

    <div class="input-group">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="Enter username" />
    </div>
    
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter password" />
    </div>

    <button onclick="handleLogin()" style="width: 100%; margin-top: 10px;">Log In</button>
    
    <div id="loginErrorMsg" style="color: #ef4444; font-size: 13px; text-align: center; margin-top: 15px;"></div>
  </div>

  <script>
    async function handleLogin() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value.trim();
      const errorDiv = document.getElementById('loginErrorMsg');
      errorDiv.innerText = '';

      if (!username || !password) {
        errorDiv.innerText = 'Please enter both username and password.';
        return;
      }

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('userId', data.userId);
          localStorage.setItem('role', data.role);
          localStorage.setItem('username', data.username);

          if (data.role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'student.html';
          }
        } else {
          errorDiv.innerText = data.message || 'Invalid credentials.';
        }
      } catch (err) {
        console.error(err);
        errorDiv.innerText = 'Server connection error. Please try again.';
      }
    }
  </script>
</body>
</html>
